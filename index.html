<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker Kuliah</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <div class="header">
      <div>
        <h1>Task Tracker Kuliah <small class="tag">v2 · REST API</small></h1>
        <div class="date" id="today-date"></div>
      </div>
    </div>

    <form class="add-form" id="add-form" novalidate>
      <input type="text" id="task-input" placeholder="Judul tugas (min. 3 karakter)" autocomplete="off" />
      <div class="add-row">
        <select id="course-select" aria-label="Mata kuliah">
          <option value="">Memuat mata kuliah…</option>
        </select>
        <input type="date" id="deadline-input" aria-label="Deadline" />
        <button type="submit" class="add-btn" id="add-btn">Tambah</button>
      </div>
      <p class="form-error" id="form-error" hidden></p>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="active">Aktif</button>
        <button class="filter-btn" data-filter="done">Selesai</button>
      </div>
      <div class="counter" id="active-count"></div>
    </div>

    <ul class="task-list" id="task-list"></ul>

  </div>

  <!-- Mock API harus dimuat SEBELUM app.js -->
  <script src="https://fuaddary.github.io/Pemrograman-Web/assets/mock-api-kampus.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
